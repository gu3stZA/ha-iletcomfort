# Keeps this fork's local-LAN branch current with upstream releases.
#
# Daily (and on demand): if tgenov/ha-iletcomfort has published a release that
# this branch does not contain yet, merge that release tag, run the full test
# suite, and only if everything passes push the merge and publish a release
# here (vX.Y.Z.N = upstream X.Y.Z + local mode, N counts our own builds), which
# Home Assistant's HACS/Marketplace then offers as an update.
#
# Also test and publish local integration changes on the fork's default branch.
# Compare the installable files with the most recent published fork build so
# documentation edits, retries and scheduled runs do not cut duplicate releases.
#
# On a merge conflict or a failing test nothing is pushed: the working branch
# stays as it was and an issue is opened in this fork. Note: GITHUB_TOKEN
# cannot push changes to workflow files, so if an upstream release edits
# .github/workflows the push fails and is reported the same way (sync by hand).
name: Sync upstream release

on:
  push:
    branches: [feat/local-lan-transport]
    paths:
      - custom_components/iletcomfort/**
      - hacs.json
      - .github/workflows/sync-upstream.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Merge and test only; push nothing, publish no release"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: tgenov/ha-iletcomfort
  # A manual run can test a different branch; only the default branch publishes.
  BRANCH: ${{ github.ref_name }}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Find latest upstream release
        id: up
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" \
            "+refs/tags/$tag:refs/tags/upstream-$tag"
          # Read all published stable releases; tags alone may have no HACS release.
          base="v${tag#v}"
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | [.tag_name, (if .draft or .prerelease then "reserved" else "stable" end)] | @tsv')
          latest=$(printf '%s\n' "$releases" | awk -v prefix="$base." \
            '$2 == "stable" && index($1, prefix) == 1 && substr($1, length(prefix)+1) ~ /^[0-9]+$/ { print $1 }' \
            | sort -V | tail -n 1)
          merge=false
          needed=true
          if ! git merge-base --is-ancestor "upstream-$tag" HEAD; then
            merge=true
          elif [[ -n "$latest" ]]; then
            needed=false
            # Only the default branch publishes fork-only changes.
            if [[ "$BRANCH" == "$DEFAULT_BRANCH" ]]; then
              git fetch --no-tags origin "refs/tags/$latest"
              previous=$(git rev-parse 'FETCH_HEAD^{commit}')
              if git diff --quiet "$previous" HEAD -- custom_components/iletcomfort hacs.json; then
                echo "Installable files match $latest."
              else
                diff_status=$?
                [[ "$diff_status" == 1 ]] || exit "$diff_status"
                git merge-base --is-ancestor "$previous" HEAD
                needed=true
              fi
            fi
          fi
          # A draft, prerelease or bare tag may already occupy the next suffix.
          refs=$(git ls-remote --refs --tags origin "refs/tags/$base.*")
          highest=$({
            printf '%s\n' "$releases" | cut -f1
            printf '%s\n' "$refs" | sed -n 's|.*refs/tags/||p'
          } | awk -v prefix="$base." 'index($0, prefix) == 1 {
            n = substr($0, length(prefix)+1); if (n ~ /^[0-9]+$/ && n+0 > max) max=n+0
          } END { print max+0 }')
          echo "fork_tag=$base.$((highest + 1))" >> "$GITHUB_OUTPUT"
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Merge upstream release
        if: steps.up.outputs.merge == 'true'
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit -m "chore: merge upstream $TAG" "upstream-$TAG"

      - name: Set up uv and Python
        if: steps.up.outputs.needed == 'true'
        # Same setup as the project's own tests.yml.
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Run tests
        if: steps.up.outputs.needed == 'true'
        run: |
          uv venv
          uv pip install -r requirements_test.txt
          uv run pytest tests/ -q

      - name: Push and publish release
        if: steps.up.outputs.needed == 'true' && !inputs.dry_run && github.ref_name == github.event.repository.default_branch
        env:
          TAG: ${{ steps.up.outputs.tag }}
          FORK_TAG: ${{ steps.up.outputs.fork_tag }}
        run: |
          git push origin "HEAD:$BRANCH"
          git push --force-with-lease="refs/tags/$FORK_TAG:" origin "HEAD:refs/tags/$FORK_TAG"
          gh release create "$FORK_TAG" \
            --verify-tag \
            --title "$FORK_TAG (upstream $TAG + local LAN mode)" \
            --generate-notes \
            --notes "Based on upstream [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG). Tests passed in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      - name: Report failure
        if: failure() && !inputs.dry_run
        env:
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          title="Upstream sync failed for ${TAG:-latest release}"
          if gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number' | grep -q .; then
            echo "An open issue already tracks this failure."
            exit 0
          fi
          gh issue create --title "$title" --body "The workflow could not complete the sync, tests or release for upstream ${TAG:-release}. Check the run log, branch and tags before retrying.

          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          To sync by hand: merge upstream $TAG into \`$BRANCH\`, fix conflicts, run \`pytest\` and push. The next run (or a manual one) then publishes the release."
